<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>Помилка · Сайт знайомств</title>
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<!-- Сторінка помилки: використовується і обробником винятків, і стандартним /error Spring Boot -->
<main class="container narrow">
    <div class="error-box">
        <p class="error-code" th:text="${status} ?: 500">404</p>

        <h1 th:switch="${status}">
            <span th:case="400">Некоректний запит</span>
            <span th:case="403">Дію заборонено</span>
            <span th:case="404">Сторінку не знайдено</span>
            <span th:case="409">Операцію неможливо виконати</span>
            <span th:case="*">Щось пішло не так</span>
        </h1>

        <p th:text="${message} ?: (${detail} ?: 'Спробуйте повернутися на головну сторінку.')">Опис помилки</p>

        <a class="btn" th:href="@{/}">На головну</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
