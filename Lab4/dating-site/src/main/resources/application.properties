spring.application.name=dating-site

# Сесія відстежується лише через cookie (без ;jsessionid=... в URL)
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Кодування запитів і відповідей
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Документація OpenAPI (springdoc-openapi)
#   специфікація:  /v3/api-docs  та  /v3/api-docs.yaml
#   Swagger UI:     /swagger-ui.html
springdoc.api-docs.version=openapi_3_0
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.writer-with-default-pretty-printer=true
